[platformio]

; BSEC 3.3.0.0 staging.  deps/bosch-sensortec/bsec_library_v3.x/ must be the
; ROOT of the Bosch BSEC zip, i.e. it must directly contain release_bin/ and
; examples/.  BSEC 3.2.1.0 and older used algo/bsec_IAQ/ instead of
; release_bin/IAQ/ and will NOT build.
; See deps/bosch-sensortec/README.md.
[bsec3_lib]
build_flags = 
    -I../deps/bosch-sensortec/BME690_SensorAPI/
    -I../deps/bosch-sensortec/bsec_library_v3.x/release_bin/IAQ/inc
    -I../deps/bosch-sensortec/bsec_library_v3.x/release_bin/IAQ/config/bme690/bme690_iaq_33v_3s_4d
    -I../deps/bosch-sensortec/bsec_library_wrappers/
    -L../deps/bosch-sensortec/bsec_library_v3.x/release_bin/IAQ/bin/esp/esp32_s3
    -lalgobsec

    
build_src_filter = 
    +<../../deps/bosch-sensortec/BME690_SensorAPI/bme69x.c>
    +<../../deps/bosch-sensortec/bsec_library_v3.x/release_bin/IAQ/config/bme690/bme690_iaq_33v_3s_4d/bsec_iaq.c>

[env]
